name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        working-directory: src
        run: python -m hybrid_job_titles --out ../dist
      - name: Package
        run: |
          cd dist/HybridJobTitles
          zip -r "../../HybridJobTitles-${GITHUB_REF_NAME}.zip" x64
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HybridJobTitles-*.zip
          generate_release_notes: true
